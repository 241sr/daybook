<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Person Ledger Dashboard</title>
  <!-- Tailwind CSS for modern responsive design -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6">

  <div class="max-w-6xl mx-auto">
    <header class="mb-8 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Directory & Ledger Dashboard</h1>
        <p class="text-sm text-slate-500">Click any person card to view transactions, edit, or delete records.</p>
      </div>
      <button onclick="loadDashboard()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 transition">Refresh</button>
    </header>

    <!-- Person Tiles Grid -->
    <div id="personsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Dynamically Injected Tiles -->
      <div class="p-6 bg-white rounded-xl shadow-sm border border-slate-200 animate-pulse">Loading persons...</div>
    </div>
  </div>

  <!-- Modal Popup for Person Ledger -->
  <div id="ledgerModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden flex flex-col max-h-[90vh]">
      
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <div>
          <h3 id="modalPersonName" class="text-lg font-bold text-slate-900">Ledger Details</h3>
          <p class="text-xs text-slate-500">Manage transaction history for this person</p>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
      </div>

      <!-- Modal Body (Transaction Table) -->
      <div class="p-6 overflow-y-auto flex-1">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
              <th class="pb-3">Date</th>
              <th class="pb-3">Type</th>
              <th class="pb-3">Amount</th>
              <th class="pb-3">Notes</th>
              <th class="pb-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="modalTableBody" class="divide-y divide-slate-100 text-sm">
            <!-- Dynamically populated rows -->
          </tbody>
        </table>
      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-300 transition">Close</button>
      </div>

    </div>
  </div>

  <!-- Edit Row Inline Modal or Form Overlay (Simple prompt/inline handling) -->

  <script>
    // Load persons grid on start
    window.onload = function() {
      loadDashboard();
    };

    function loadDashboard() {
      google.script.run
        .withSuccessHandler(renderPersonsGrid)
        .withFailureHandler(err => alert('Error loading data: ' + err.message))
        .getDashboardData();
    }

    function renderPersonsGrid(persons) {
      const grid = document.getElementById('personsGrid');
      grid.innerHTML = '';

      if (!persons || persons.length === 0) {
        grid.innerHTML = '<div class="col-span-full p-6 bg-white rounded-xl text-center text-slate-500">No transaction records found.</div>';
        return;
      }

      persons.forEach(p => {
        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-xl shadow-sm border border-slate-200 hover:shadow-md hover:border-indigo-300 transition cursor-pointer flex flex-col justify-between";
        card.onclick = () => openLedgerModal(p.name);

        const balanceColor = p.totalBalance >= 0 ? 'text-emerald-600' : 'text-rose-600';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 font-bold flex items-center justify-center text-sm">
                ${p.name.charAt(0).toUpperCase()}
              </span>
              <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-full">${p.transactionCount} txns</span>
            </div>
            <h4 class="font-semibold text-slate-800 text-base truncate">${p.name}</h4>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
            <span class="text-xs text-slate-400">Net Balance</span>
            <span class="font-bold text-sm ${balanceColor}">₹${p.totalBalance.toLocaleString()}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openLedgerModal(personName) {
      document.getElementById('modalPersonName').innerText = personName + "'s Ledger";
      document.getElementById('ledgerModal').classList.remove('hidden');
      
      google.script.run
        .withSuccessHandler(renderLedgerTable)
        .getTransactionsByPerson(personName);
    }

    function closeModal() {
      document.getElementById('ledgerModal').classList.add('hidden');
      loadDashboard(); // Refresh grid in case edits happened
    }

    function renderLedgerTable(transactions) {
      const tbody = document.getElementById('modalTableBody');
      tbody.innerHTML = '';

      if (!transactions || transactions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">No transactions recorded for this person.</td></tr>`;
        return;
      }

      transactions.forEach(t => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="py-3 text-slate-600">${t.date}</td>
          <td class="py-3"><span class="px-2 py-1 rounded text-xs font-medium bg-slate-100 text-slate-700">${t.type}</span></td>
          <td class="py-3 font-semibold text-slate-800">₹${Number(t.amount).toLocaleString()}</td>
          <td class="py-3 text-slate-500 truncate max-w-xs">${t.notes || '-'}</td>
          <td class="py-3 text-right space-x-2">
            <button onclick="editTransaction(${t.rowIndex}, '${t.date}', '${t.name}', '${t.type}', ${t.amount}, '${t.notes}')" class="text-indigo-600 hover:text-indigo-800 text-xs font-semibold">Edit</button>
            <button onclick="removeTransaction(${t.rowIndex})" class="text-rose-500 hover:text-rose-700 text-xs font-semibold">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function removeTransaction(rowIndex) {
      if (confirm('Are you sure you want to delete this transaction?')) {
        google.script.run
          .withSuccessHandler(() => {
            // Refresh modal data for current person name
            const currentName = document.getElementById('modalPersonName').innerText.replace("'s Ledger", "");
            openLedgerModal(currentName);
          })
          .deleteTransaction(rowIndex);
      }
    }

    function editTransaction(rowIndex, date, name, type, amount, notes) {
      // Prompt inputs for simplicity, or bind to a custom edit sub-form
      const newAmount = prompt("Edit Amount:", amount);
      if (newAmount === null) return;
      
      const newType = prompt("Edit Type (Credit/Debit):", type);
      if (newType === null) return;

      const newNotes = prompt("Edit Notes:", notes);
      if (newNotes === null) return;

      const updatedData = {
        date: date,
        name: name,
        type: newType,
        amount: parseFloat(newAmount),
        notes: newNotes
      };

      google.script.run
        .withSuccessHandler(() => {
          openLedgerModal(name);
        })
        .updateTransaction(rowIndex, updatedData);
    }
  </script>
</body>
</html>
